[project]
name = "histostate"
version = "0.1.0"
description = "Predict glioblastoma cell-state composition from H&E slides with pathology foundation models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "mlflow>=2.14",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histostate"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
