[project]
name = "histostate"
version = "0.1.0"
description = "Predict glioblastoma cell-state composition from H&E slides with pathology foundation models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Todd Creasy", email = "toddcreasy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "medmnist>=3.0.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
]

[project.scripts]
histostate = "histostate.ask:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: test makes network calls; skipped by default, run with -m network"]
