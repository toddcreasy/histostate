# Secret scan for every commit, in CI (.github/workflows/ci.yml, job "secrets") and before a
# local commit (.pre-commit-config.yaml). gitleaks' default rules find API keys, tokens, and
# private keys; the rules below add what this project must also never commit: email
# addresses, passwords, usernames, and credentials inside URLs. Adapted from ehr-rwe-eln.
#
# An allowlist entry here says why a match is not a secret. Add one only for a value that is
# public by design, never to get a real credential past the check.

title = "histostate secret scan"

[extend]
useDefault = true

[[rules]]
id = "email-address"
description = "An email address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]

  [[rules.allowlists]]
  description = "Reserved example domains (RFC 2606)"
  regexTarget = "match"
  regexes = ['''@(?:[A-Za-z0-9-]+\.)*example\.(?:com|org|net)$''']

  [[rules.allowlists]]
  description = "GitHub's public noreply addresses, made to be published"
  regexTarget = "match"
  regexes = ['''@users\.noreply\.github\.com$''']

  [[rules.allowlists]]
  description = "The maintainer's contact address in the README's Contact section, public on purpose"
  condition = "AND"
  regexTarget = "match"
  regexes = ['''^todd\.creasy@pilotbio\.io$''']
  paths = ['''^README\.md$''']

[[rules]]
id = "password-literal"
description = "A password or secret given as a quoted literal, in an assignment or a setenv call"
# No word boundary before the keyword: DB_PASSWORD must match, and "_" counts as a word character.
# Spaces and tabs only around the separator: a match never spans lines.
regex = '''(?i)(?:password|passwd|pwd|secret)[a-z_]*["']?[ \t]*[:=,][ \t]*["']([^"'\s]{3,})["']'''
secretGroup = 1
keywords = ["password", "passwd", "pwd", "secret"]

  [[rules.allowlists]]
  description = "An environment variable's name, not its value (a list of names such as DB_PASSWORD, LOG_LEVEL). Names need an underscore, so an all-caps secret such as a base32 key is still caught"
  regexTarget = "secret"
  regexes = ['''^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$''']

[[rules]]
id = "password-env"
description = "A password, secret, token, or key set in an env file or YAML: DB_PASSWORD=value"
# Env files, YAML, shell, config, and Markdown only: in code, NAME=value is usually not a literal.
path = '''(?i)(?:^|/)(?:\.env[^/]*|[^/]*\.(?:env|ya?ml|ini|cfg|conf|properties|sh|bash|zsh|md|txt)|Dockerfile[^/]*)$'''
# At a line's start or after a space or ";", so -e POSTGRES_PASSWORD=value in a command counts.
regex = '''(?im)(?:^|[ \t;])(?:export[ \t]+)?[a-z0-9_.-]*(?:password|passwd|pwd|secret|token|api_key)[a-z0-9_.-]*[ \t]*[=:][ \t]*([^\s"'#$`|]{3,})'''
secretGroup = 1
keywords = ["password", "passwd", "pwd", "secret", "token", "api_key"]

  [[rules.allowlists]]
  description = "GitHub Actions' id-token permission (id-token: write), which lets a workflow ask for an OIDC token; not a token itself"
  regexTarget = "match"
  regexes = ['''id-token:[ \t]*(?:write|read|none)[,}]*$''']

[[rules]]
id = "url-credentials"
description = "A username and password inside a URL"
regex = '''\b[a-z][a-z0-9+.-]*://([^\s/:@'"]+):([^\s/@'"]+)@[^\s/'"]+'''
keywords = ["://"]

  [[rules.allowlists]]
  description = "Placeholders, not credentials"
  regexTarget = "match"
  regexes = ['''://(?:user|username|USER|\$\{?[A-Za-z_]+\}?):(?:pass|password|PASSWORD|\$\{?[A-Za-z_]+\}?)@''']

[[rules]]
id = "username-assignment"
description = "A username assigned a literal value"
# No word boundary before the keyword, and any prefix: POSTGRES_USER and db_username must match.
# Nothing after it, so user_id and user_agent don't. Spaces and tabs only around the separator.
regex = '''(?i)[a-z_]*(?:user(?:name)?|login)["']?[ \t]*[:=][ \t]*["']([^"'\s]{3,})["']'''
secretGroup = 1
keywords = ["user", "login"]

  [[rules.allowlists]]
  description = "Docker's numeric user, quoted (user: \"1000:1000\"), a uid and gid rather than a login"
  regexTarget = "match"
  regexes = ['''(?i)(?:^|[ \t])user[ \t]*:[ \t]*["']\d+(?::\d+)?["']$''']

[[rules]]
id = "username-env"
description = "A username set unquoted in an env file, YAML, or shell: POSTGRES_USER=value"
# An inline user:password pair (curl -u svc_user:Pa55word) is not a key and value, so it isn't
# this rule's to catch; a colon counts as a separator only with whitespace after it, as in YAML.
# Config and shell files; not .md or .txt, where prose says things like "Login: use SSO". Keys may
# hold dots, hyphens, and digits (spring.datasource.username, db-user, PG2_USER). $VAR and ${{ }}
# are references, not values, so they're skipped.
path = '''(?i)(?:^|/)(?:\.env[^/]*|[^/]*\.(?:env|ya?ml|ini|cfg|conf|properties|sh|bash|zsh)|Dockerfile[^/]*)$'''
regex = '''(?im)(?:^|[ \t;])(?:export[ \t]+)?[a-z0-9_.-]*(?:user(?:name)?|login)(?:[ \t]*=[ \t]*|[ \t]*:[ \t]+)([^\s"'#$`|{]{3,})'''
secretGroup = 1
keywords = ["user", "login"]

  [[rules.allowlists]]
  description = "Settings, not usernames (auto_login: true), and system accounts that aren't credentials"
  regexTarget = "secret"
  regexes = ['''(?i)^(?:true|false|yes|no|on|off|null|none|root|nobody)$''']

  [[rules.allowlists]]
  description = "Docker's numeric user (user: 1000 or 1000:1000), a uid and gid rather than a login"
  regexTarget = "match"
  regexes = ['''(?i)(?:^|[ \t])user[ \t]*:[ \t]*\d+(?::\d+)?$''']

[[rules]]
id = "username-env-docs"
description = "A username in a shell-style assignment inside Markdown or text: export DB_USER=value"
# username-env leaves .md and .txt alone because prose says things like "Login: use SSO". Shell
# lines in docs still count: an all-caps key ending in USER, USERNAME, or LOGIN, then = with no
# spaces. $VAR and ${{ }} are references, not values, so they're skipped.
path = '''(?i)(?:^|/)[^/]*\.(?:md|txt)$'''
regex = '''(?m)(?:^|[ \t;])(?:export[ \t]+)?(?:[A-Z][A-Z0-9_]*)?(?:USER|USERNAME|LOGIN)=([^\s"'#$`|{]{3,})'''
secretGroup = 1
keywords = ["user=", "username=", "login="]

  [[rules.allowlists]]
  description = "A path, not a username (R_LIBS_USER=~/R/library or ./r-lib): a value that starts like one. scott/tiger and scott/tiger@orcl, Oracle's user/password forms, are still caught"
  regexTarget = "secret"
  regexes = ['''^(?:~|\.{0,2}/)''']

[[rules]]
id = "username-props"
description = "A username in a .properties, .ini, .cfg, or .conf file, where key:value needs no space: db.user:jsmith"
# These formats allow a bare colon as well as =, unlike YAML. The key starts the line, so text
# further along a line isn't read as a key.
path = '''(?i)(?:^|/)[^/]*\.(?:ini|cfg|conf|properties)$'''
regex = '''(?im)^[ \t]*[a-z0-9_.-]*(?:user(?:name)?|login)[ \t]*[:=][ \t]*([^\s"'#$`|{]{3,})'''
secretGroup = 1
keywords = ["user", "login"]

  [[rules.allowlists]]
  description = "Settings, not usernames (auto_login=true), and system accounts that aren't credentials"
  regexTarget = "secret"
  regexes = ['''(?i)^(?:true|false|yes|no|on|off|null|none|root|nobody)$''']

[[rules]]
id = "credential-pair"
description = "A username and password joined by a colon, after a flag or key that takes credentials: --proxy-user svc:Pa55word, basic_auth: deploy:Pa55word"
# Only where a credential pair goes, since name:name elsewhere is usually owner:group. gitleaks'
# own curl-auth-user covers curl -u. $VAR references never match: neither half may hold a $. Nor
# a backtick, so a pair in Markdown code (`basic_auth: a:b`) ends where the code does.
# The password half can't start with //, so a URL after --user (pip install --user git+https://...)
# isn't read as scheme:password; a password starting with one / is still caught.
regex = '''(?i)(?:--(?:proxy-)?user|basic[_-]?auth|http[_-]?auth)["']?(?:[ \t]*[=:][ \t]*|[ \t]+)["']?([^\s:"'@/$`]{1,64}:(?:[^\s"'@$`/][^\s"'@$`]{3,}|/[^\s"'@$`/][^\s"'@$`]{2,}))'''
secretGroup = 1
keywords = ["--user", "--proxy-user", "basic_auth", "basicauth", "basic-auth", "http_auth", "httpauth", "http-auth"]

  [[rules.allowlists]]
  description = "A numeric uid:gid (docker run --user 1000:1000), not a login"
  regexTarget = "secret"
  regexes = ['''^\d+:\d+$''']

  [[rules.allowlists]]
  description = "Container and file-owner commands, where --user name:name is a user and group, not a password"
  regexTarget = "line"
  regexes = ['''(?i)\b(?:docker|podman|nerdctl|chown|chgrp)\b''']

  [[rules.allowlists]]
  description = "Placeholders in docs and examples (user:password, <name>:<password>)"
  regexTarget = "secret"
  regexes = ['''(?i)^(?:user(?:name)?|<[^>]*>|x+):(?:pass(?:word)?|<[^>]*>|x+|\*+)$''']
